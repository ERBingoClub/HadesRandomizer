name: Build and Release
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MinVer CLI
        run: dotnet tool install -g minver-cli

      - name: Add dotnet tools to PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Compute version
        id: version
        run: |
          $ver = minver-cli
          echo "VERSION=$ver" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build
        run: dotnet build Hades/Hades.csproj -c Release -o "Hades-${{ env.VERSION }}"

      - name: Zip build output
        run: Compress-Archive -Path "Hades-${{ env.VERSION }}/*" -DestinationPath "Hades-${{ env.VERSION }}.zip"
        shell: pwsh

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: Hades-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
